<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <style>
        body{
          font-family:'Poppins', sans-serif;
          height: 100vh;
          display: flex;
          justify-content:center;
          align-items:center;
        }
        .input-group{
            position: relative;
            width:300px;
            display: grid;

        }
       .input-group input{
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            margin-bottom: 30px;
            border:none;
            border-bottom: 1px solid #333;
            outline:none;
            background: transparent;
            
            
            
        }
        .input-group label{
            position: absolute;
            top:0;
            left:0;
            padding: 10px 0;
            font-size: 16px;
            color:#333;
            pointer-events:none;
            transition:.5s;
            

        }
        .input-group input:focus ~ label,
        .input-group input:valid ~ label{
            top:-18px;
            left:0;
            color:#03a9f4;
            font-size:12px;
         }
     
    </style>
</head>
<body>
    <div>
    <div class="input-group">
        <input type="text" id="username" required>
        <label for="username">Username</label>
    </div>
   
    <div class ="input-group">
        <input type="email" name ="" id="inp" required>
<label for ="email"> Email</label>
<button id="btn" disabled>Submit</button>
    </div>
    <div class ="input-group">
        <input type="password" id="passInp" required>
<label for ="password"> password</label>

    </div>
    <input type="submit" value="Login">
    <a href="#forgot link"></a>
    
    </div>

    <script>
        let i = document.getElementById("inp");
        let b = document.getElementById("btn");
        i.oninput =()=>{
            b.disabled = !(i.value.includes("@") && 
        i.value.includes("gmail.com"));
        }
    </script>
    
</body>
</html>
